<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background: black;
            color: #00f5d4;
            font-family: monospace;
            text-align: center;
            padding-top: 80px;
        }
        input {
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
            border: none;
            width: 250px;
        }
        button {
            padding: 10px 20px;
            background: #00f5d4;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        button:hover {
            background: #0bbcd6;
        }
    </style>
</head>
<body>

    <h2>⚡ SYSTEM LOGIN</h2>

    <form method="POST" action="/login">

        <input type="text" name="username" placeholder="Enter Username"><br>
        <input type="password" name="password" placeholder="Enter Password"><br>

        <button type="submit">Access System</button>

    </form>

</body>
</html>
