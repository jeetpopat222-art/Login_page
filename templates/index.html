<!DOCTYPE html>
<html>
<head>
    <title>🔥 Welcome</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #3a0ca3);
            color: white;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }
        .btn {
            background: #00f5d4;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background: #0bbcd6;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <h1>🚀 Welcome to the Portal</h1>
    <p>Click below to enter the system</p>

    <a href="/login">
        <button class="btn">Go to Login 🔐</button>
    </a>

</body>
</html>
